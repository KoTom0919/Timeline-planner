<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工程表作成</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">WORK SCHEDULER</p>
        <h1>工程表作成</h1>
      </div>

      <div class="topbar-actions">
        <button
          id="addMemberTop"
          class="secondary topbar-button"
          type="button"
        >
          ＋ メンバーを追加
        </button>

        <button
          id="addTaskTop"
          class="secondary topbar-button"
          type="button"
        >
          ＋ 作業を追加
        </button>

        <button id="makeScheduleTop" class="primary" type="button">
          工程表を作成
        </button>
      </div>
    </header>

    <main class="container">
      <section class="panel">
        <div class="section-head">
          <div>
            <h2>全体設定</h2>
            <p id="overallSettingsDescription">
              作業時間とメンバーを入力します
            </p>
          </div>
        </div>

        <div class="overall-time">
          <label>
            <span id="workStartLabel">開始日時</span>
            <input
              id="workStart"
              type="text"
              inputmode="numeric"
              placeholder="2026-09-03 07:00"
            />
          </label>

          <label>
            <span id="workEndLabel">終了日時</span>
            <input
              id="workEnd"
              type="text"
              inputmode="numeric"
              placeholder="2026-09-03 20:00"
            />
          </label>

          <label class="schedule-step-field">
            <span>工程の最小単位</span>

            <div class="schedule-step-inputs">
              <input
                id="scheduleStepValue"
                type="number"
                min="1"
                step="1"
                value="15"
              />

              <select
                id="scheduleStepUnit"
                aria-label="工程の最小単位の単位"
              >
                <option value="minute">分</option>
                <option value="hour">時間</option>
                <option value="day">日</option>
              </select>
            </div>
          </label>
        </div>

        <div class="sub-head">
          <h3>メンバー</h3>
          <button id="addMember" class="secondary" type="button">
            ＋ メンバーを追加
          </button>
        </div>

        <div id="memberList" class="stack"></div>
      </section>

      <section class="task-section">
        <div class="section-head">
          <div>
            <h2>作業カード</h2>
            <p>
              上にあるカードほど優先度が高く、
              開始日時なしの作業は空き時間へ配置します
            </p>
          </div>

          <button id="addTask" class="secondary dark" type="button">
            ＋ 作業を追加
          </button>
        </div>

        <div id="taskList" class="task-grid"></div>
      </section>

      <section id="resultSection" class="panel">
        <div class="section-head">
          <div>
            <h2>工程表</h2>
            <p id="resultMessage">
              「工程表を作成」を押すと表示されます
            </p>
          </div>

          <button
            id="printSchedule"
            class="secondary print-button"
            type="button"
          >
            工程表を印刷
          </button>
        </div>

        <div class="axis-controls">
          <label for="axisZoom">横軸の幅（最小単位あたり）</label>

          <input
            id="axisZoom"
            type="range"
            min="10"
            max="100"
            step="1"
            value="24"
          />

          <output id="axisZoomValue" for="axisZoom">24px</output>

          <span>
            二重線：全員に作業・休憩のない時間帯を省略
          </span>
        </div>

        <div id="resultArea" class="result-scroll">
          <div class="empty">工程表はまだありません</div>
        </div>
      </section>
    </main>

    <div class="mobile-action">
      <button id="makeScheduleBottom" class="primary" type="button">
        工程表を作成
      </button>
    </div>

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
